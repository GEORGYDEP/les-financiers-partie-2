<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Paiement — Partie 2 · Le paiement par la banque | ISTLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM
   ============================================================ */
:root{
  --bg:#070b17; --bg2:#0e1528; --bg3:#172038; --card:#111a31;
  --accent:#22d68a; --blue:#5b8cff; --violet:#9d7bff; --orange:#ff8a3d; --gold:#ffc94d;
  --text:#eef2fb; --text2:#aab4cc; --text3:#7b88a8;
  --border:#25304f; --radius:18px; --success:#22d68a; --error:#ff5470;
  --paper:#f6f3e9; --ink:#1b2236;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Space Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(60rem 40rem at 8% -10%,rgba(91,140,255,.18),transparent 60%),
  radial-gradient(50rem 36rem at 108% 18%,rgba(34,214,138,.11),transparent 60%),
  radial-gradient(42rem 30rem at 50% 118%,rgba(157,123,255,.10),transparent 60%)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ============================================================
   HUD
   ============================================================ */
.hud{position:sticky;top:0;z-index:50;background:rgba(7,11,23,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 16px 8px}
.hud-in{max-width:900px;margin:0 auto}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;text-align:left;border-radius:12px}
.logo-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;background:linear-gradient(135deg,var(--accent),var(--blue));box-shadow:0 4px 18px rgba(34,214,138,.35)}
.logo-tx small{display:block;font-size:.66rem;font-weight:600;color:var(--text3);letter-spacing:.12em;text-transform:uppercase}
.pills{display:flex;align-items:center;gap:6px}
.pill{font-family:var(--mono);font-size:.78rem;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);white-space:nowrap;transition:border-color .15s,color .15s}
.pill.xp{color:var(--accent);border-color:rgba(34,214,138,.4)}
.pill.hot{color:var(--orange);border-color:rgba(255,138,61,.55);animation:pulse 1s ease-in-out infinite}
button.pill:hover{border-color:var(--blue);color:var(--text)}
.xpbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:8px;font-size:.76rem}
.xp-rank{font-weight:700;white-space:nowrap}
.xp-track{position:relative;height:10px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);overflow:hidden}
.xp-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp-mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.38)}
.xp-next{color:var(--text3);font-family:var(--mono);font-size:.68rem;white-space:nowrap}
.lv-dots{display:flex;justify-content:center;gap:8px;margin-top:8px}
.pd{width:28px;height:28px;border-radius:50%;font-size:.74rem;font-weight:700;font-family:var(--mono);background:var(--bg3);border:1px solid var(--border);color:var(--text2);display:grid;place-items:center;transition:transform .15s}
.pd:hover:not(:disabled){transform:scale(1.12)}
.pd.done{background:rgba(34,214,138,.15);border-color:var(--accent);color:var(--accent)}
.pd.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.16)}
.pd.locked{opacity:.45}

/* ============================================================
   STRUCTURE GÉNÉRALE
   ============================================================ */
main{max-width:860px;margin:0 auto;padding:22px 16px 96px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%),var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.enter{animation:slideUp .35s ease-out}
h2,h3{line-height:1.25}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;border:1px solid transparent;transition:transform .15s,box-shadow .15s,background .15s,opacity .15s,border-color .15s}
.btn.primary{background:linear-gradient(135deg,var(--accent),#19b8a0);color:#04121a;box-shadow:0 8px 24px rgba(34,214,138,.28)}
.btn.primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(34,214,138,.42)}
.btn.ghost{background:var(--bg3);border-color:var(--border);color:var(--text)}
.btn.ghost:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.big{font-size:1.1rem;padding:15px 36px;border-radius:14px}
.btn.lb-app{border-color:var(--accent);color:var(--accent)}
.btn.lb-app:hover{background:var(--accent);color:#04121a}
.btn.lb-glob{border-color:var(--orange);color:var(--orange)}
.btn.lb-glob:hover{background:var(--orange);color:#04121a}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}
.actions.end{justify-content:flex-end}
.actions.center{justify-content:center}
.lb-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.link{color:var(--text2);font-weight:600;font-size:.9rem;padding:6px 4px;border-radius:8px}
.link:hover{color:var(--text)}

/* ============================================================
   ACCUEIL
   ============================================================ */
.welcome{text-align:center;padding:34px 6px 10px}
.w-badge{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(34,214,138,.4);background:rgba(34,214,138,.08);padding:6px 14px;border-radius:999px}
.welcome h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;line-height:1.05;margin:18px 0 6px;background:linear-gradient(135deg,#fff 10%,#9fb6ff 60%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome h1 span{display:block;font-size:.48em;letter-spacing:.2em;text-transform:uppercase;-webkit-text-fill-color:var(--gold);margin-top:8px}
.w-sub{font-size:1.15rem;font-weight:600;color:var(--text)}
.w-desc{color:var(--text2);max-width:560px;margin:10px auto 0}
.w-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:640px;margin:26px auto}
.w-stats div{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 6px}
.w-stats b{display:block;font-family:var(--mono);font-size:1.25rem;color:var(--accent)}
.w-stats span{font-size:.74rem;color:var(--text2)}
.who{font-size:.86rem;color:var(--text2);margin-bottom:18px}

/* ============================================================
   PARCOURS (HUB)
   ============================================================ */
.h-title{font-size:1.35rem;font-weight:800;margin:6px 0 16px}
.path{position:relative;display:flex;flex-direction:column;gap:22px;padding:8px 0 4px}
.path::before{content:'';position:absolute;top:0;bottom:0;left:50%;border-left:3px dotted var(--border);transform:translateX(-1.5px)}
.node-row{position:relative;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center}
.node{grid-column:2;grid-row:1;justify-self:center;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--mono);background:var(--bg3);border:2px solid var(--border);z-index:1}
.node.done{background:var(--accent);border-color:var(--accent);color:#04121a}
.node.cur{border-color:var(--gold);color:var(--gold);animation:glow 1.6s ease-in-out infinite}
.node.locked{opacity:.6}
.node-row.left .lv-card{grid-column:1;grid-row:1}
.node-row.right .lv-card{grid-column:3;grid-row:1}
.lv-card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .2s,border-color .2s;width:100%}
.lv-card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--blue)}
.lv-card:disabled{opacity:.5}
.lv-card.cur{border-color:rgba(255,201,77,.6)}
.lv-ic{font-size:1.9rem;line-height:1}
.lv-body b{display:block;line-height:1.25}
.lv-body small{display:block;color:var(--text2);margin:4px 0 8px;font-size:.86rem}
.lv-meta{font-family:var(--mono);font-size:.74rem;color:var(--accent)}
.trophies{margin-top:34px}
.tro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tro{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.tro .t-i{font-size:1.7rem;display:block}
.tro b{display:block;font-size:.86rem;margin-top:4px}
.tro small{display:block;font-size:.72rem;color:var(--text2);line-height:1.3;margin-top:3px}
.tro.off{opacity:.5}
.tro.off .t-i{filter:grayscale(1)}
.tro.on{border-color:rgba(255,201,77,.6);box-shadow:0 0 22px rgba(255,201,77,.12)}

/* ============================================================
   BRIEFING
   ============================================================ */
.b-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.b-ic{font-size:2.3rem;width:62px;height:62px;border-radius:16px;display:grid;place-items:center;background:var(--bg3);border:1px solid var(--border);flex:none}
.b-sup{font-family:var(--mono);font-size:.72rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.brief h2{font-size:1.45rem;font-weight:800}
.brief h3{font-size:1rem;font-weight:700;margin:22px 0 8px}
.objs{list-style:none;display:grid;gap:6px}
.objs li{padding:9px 12px 9px 38px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);position:relative}
.objs li::before{content:'✓';position:absolute;left:13px;top:8px;color:var(--accent);font-weight:800}
.theory p{margin-bottom:8px;color:var(--text)}
.theory b{color:#fff}
.formula{font-family:var(--mono);font-weight:700;text-align:center;padding:12px;border-radius:12px;background:var(--bg2);border:1px dashed var(--blue);color:#cfe0ff;margin:10px 0}
.fig{margin:14px 0;padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--border)}
.fig-t{font-weight:700;font-size:.9rem;margin-bottom:4px}
.fig.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.schema{width:100%;height:auto;display:block}
.sv-title{fill:var(--text);font-weight:800;font-size:15px}
.sv-box{fill:var(--bg3);stroke:var(--border);stroke-width:1.5}
.sv-box.sv-hot{stroke:var(--gold);stroke-width:2.5}
.sv-t{fill:var(--text);font-weight:700;font-size:14px}
.sv-s{fill:var(--text2);font-size:11.5px}
.sv-arrow{stroke:var(--blue);stroke-width:2.5}
.sv-head{fill:var(--blue)}
.sv-a{fill:var(--blue);font-size:11.5px;font-weight:700}
.sv-tag{fill:rgba(255,201,77,.14);stroke:var(--gold);stroke-width:1.2}
.sv-tagt{fill:var(--gold);font-size:11px;font-weight:700}
.box{border-radius:14px;padding:13px 15px;margin-top:12px;border:1px solid;font-size:.96rem}
.box-l{display:block;font-weight:700;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.box.ex{background:rgba(255,138,61,.09);border-color:rgba(255,138,61,.45)}
.box.ex .box-l{color:var(--orange)}
.box.plus{background:rgba(255,201,77,.08);border-color:rgba(255,201,77,.45)}
.box.plus .box-l{color:var(--gold)}
.predict{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pbtn{padding:13px 8px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--border);font-weight:700;transition:transform .15s,border-color .15s}
.pbtn:hover{transform:translateY(-2px);border-color:var(--blue)}
.pbtn.sel{border-color:var(--gold);background:rgba(255,201,77,.12);box-shadow:0 0 0 3px rgba(255,201,77,.16)}
.note{font-size:.82rem;color:var(--text3);margin-top:8px}

/* ============================================================
   QUESTIONS
   ============================================================ */
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-count{font-family:var(--mono);font-size:.76rem;color:var(--text2)}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:14px}
.dot{width:34px;height:8px;border-radius:999px;background:var(--bg3);border:1px solid var(--border)}
.dot.correct{background:var(--success);border-color:var(--success)}
.dot.hint{background:var(--orange);border-color:var(--orange)}
.dot.shown{background:var(--error);border-color:var(--error)}
.dot.cur{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(255,201,77,.5)}
.qcard.shake{animation:shake .45s}
.q-tag{display:inline-block;font-family:var(--mono);font-size:.72rem;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.q-text{font-size:1.16rem;font-weight:600;line-height:1.4}
.q-text b{color:var(--gold);font-weight:700}
.how{font-size:.86rem;color:var(--text2);margin-top:12px}
.data{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg2);border-left:4px solid var(--blue);font-size:.96rem}
table.mini{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
table.mini th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:5px 8px;border-bottom:1px solid var(--border)}
table.mini td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
.tries{font-family:var(--mono);font-size:.74rem;color:var(--text3);margin-right:auto}

.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--border);transition:border-color .15s,background .15s,transform .15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(3px)}
.opt.sel{border-color:var(--blue);background:rgba(91,140,255,.13)}
.opt.good{border-color:var(--success);background:rgba(34,214,138,.12)}
.opt.bad{border-color:var(--error);background:rgba(255,84,112,.10);opacity:.8}
.opt.missed{border:1.5px dashed var(--success)}
.opt.reveal{border-style:dashed}
.opt:disabled{cursor:default}
.letter,.cbx{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem;background:var(--bg3);border:1px solid var(--border)}
.opt.sel .letter,.opt.sel .cbx{background:var(--blue);border-color:var(--blue);color:#04121a}
.opt.good .letter,.opt.good .cbx{background:var(--success);border-color:var(--success);color:#04121a}
.opt.bad .letter,.opt.bad .cbx{background:var(--error);border-color:var(--error);color:#fff}

.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.vfbtn{padding:18px;border-radius:16px;font-size:1.1rem;font-weight:800;background:var(--bg2);border:1.5px solid var(--border);transition:transform .15s,border-color .15s}
.vfbtn:hover:not(:disabled){transform:translateY(-3px);border-color:var(--blue)}
.vfbtn.good{border-color:var(--success);background:rgba(34,214,138,.14)}
.vfbtn.bad{border-color:var(--error);background:rgba(255,84,112,.12)}
.vfbtn:disabled{cursor:default}

.inp-row{display:flex;align-items:center;gap:10px;margin-top:16px}
.inp{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:1.1rem;padding:13px 14px;border-radius:12px;background:var(--bg2);color:var(--text);border:1.5px solid var(--border)}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,140,255,.2)}
.unit{font-family:var(--mono);font-weight:700;font-size:1.1rem;color:var(--text2)}
.ops{display:flex;gap:6px;margin-top:8px}
.op{width:40px;height:36px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);font-family:var(--mono);font-weight:700}
.op:hover{border-color:var(--blue)}
.calc{min-height:1.5em;margin-top:8px;font-family:var(--mono);font-size:.88rem;color:var(--text2)}
.calc b{color:var(--accent)}

.reserve{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:14px;background:var(--bg2);border:1px dashed var(--border);min-height:60px;margin:12px 0}
.reserve .empty{color:var(--text3);font-size:.86rem;align-self:center}
.lab{padding:9px 12px;border-radius:11px;background:var(--bg3);border:1.5px solid var(--border);font-size:.93rem;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
button.lab:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px)}
.lab.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.2);background:rgba(255,201,77,.12)}
.lab.bounce,.m-row.bounce,.sent.bounce{animation:bounce .6s}
.lab:disabled{opacity:.5}
.lab.lock{cursor:default;display:flex;flex-direction:column;gap:2px}
.lock.g{border-color:var(--success)!important;background:rgba(34,214,138,.12)}
.lock.o{border-color:var(--orange)!important;background:rgba(255,138,61,.13)}
.lock.r{border-color:var(--error)!important;background:rgba(255,84,112,.11)}
.fix{font-style:normal;font-size:.84rem;font-weight:700;color:#ffd7de}
.zones{display:grid;gap:12px}
.zones.n2{grid-template-columns:1fr 1fr}
.zones.n3{grid-template-columns:repeat(3,1fr)}
.zone{border-radius:14px;background:var(--bg2);border:1.5px solid var(--border);padding:10px;min-height:130px;transition:border-color .15s,box-shadow .15s}
.zone.ready{border-color:var(--gold);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,201,77,.25)}
.zone-h{width:100%;font-weight:800;padding:9px 6px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);margin-bottom:8px}
.zone-h:disabled{cursor:default}
.zone-items{display:flex;flex-direction:column;gap:6px}
.zone-items .lab{width:100%}

.match{display:grid;gap:10px;margin-top:14px}
.m-row{display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--border)}
.m-left{font-size:1.05rem}
.m-right{display:grid;gap:4px}
select{font:inherit;width:100%;padding:11px 12px;border-radius:10px;background:var(--bg3);color:var(--text);border:1px solid var(--border)}
select:disabled{opacity:1;cursor:default}
.iban{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.ibg{display:flex;gap:3px}
.ib{font-style:normal;width:27px;height:36px;display:grid;place-items:center;border-radius:7px;font-family:var(--mono);font-weight:700;background:var(--bg3);border:1.5px solid var(--border)}
.ib.c1{border-color:var(--blue);color:var(--blue)}
.ib.c2{border-color:var(--accent);color:var(--accent)}
.ib.c3{border-color:var(--orange);color:var(--orange)}
.ib.c4{border-color:#ff7aa2;color:#ff7aa2}
.legend4{list-style:none;counter-reset:lg;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.88rem;margin-top:8px}
.legend4 li{counter-increment:lg;display:flex;gap:8px;align-items:center}
.legend4 li::before{content:counter(lg);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;font-weight:700;color:#04121a;flex:none}
.legend4 .c1::before{background:var(--blue)}
.legend4 .c2::before{background:var(--accent)}
.legend4 .c3::before{background:var(--orange)}
.legend4 .c4::before{background:#ff7aa2}

.slots{list-style:none;display:grid;gap:8px}

.fb{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px solid;font-size:.98rem}

.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}

.modal .m-ic{font-size:2.2rem}
.modal input{width:100%;font:inherit;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg3);color:var(--text);margin-bottom:10px}

.tabs{display:flex;gap:8px;margin-bottom:16px}

.lb-me{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;background:rgba(34,214,138,.08);border:1px solid rgba(34,214,138,.3);border-radius:14px;padding:14px 6px;margin-bottom:14px}
.lb-me b{display:block;font-size:1.15rem;font-family:var(--mono)}
.lb-me span{font-size:.66rem;color:var(--text2);letter-spacing:.08em}
table.lb-t{width:100%;border-collapse:collapse;font-size:.88rem}
table.lb-t th{text-align:left;padding:8px 4px;color:var(--text3);font-size:.7rem;text-transform:uppercase;border-bottom:1px solid var(--border)}
table.lb-t td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
table.lb-t .r{text-align:right}
table.lb-t tr.me td{background:rgba(34,214,138,.08);font-weight:700}
.lb-bar{height:4px;border-radius:2px;background:var(--bg3);margin-top:4px;overflow:hidden}
.lb-bar i{display:block;height:100%;background:var(--accent)}
.lb-msg{text-align:center;padding:36px 10px;color:var(--text2)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);margin:0 auto 12px;animation:spin .9s linear infinite}

.overlay.rank{z-index:1100;overflow:hidden}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,201,77,.07) 0 10deg,transparent 10deg 20deg);animation:spin 26s linear infinite}
.rank-card{position:relative;background:var(--bg2);border:2px solid var(--gold);border-radius:24px;padding:34px 30px;text-align:center;max-width:400px;width:100%;box-shadow:0 0 80px rgba(255,201,77,.25);animation:pop .5s}
.rank-card .r-ic{font-size:4.4rem;line-height:1}
.rank-card small{font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-size:.74rem}
.rank-card h2{font-size:1.7rem;font-weight:800;margin:4px 0 6px}
.rank-card p{color:var(--text2);margin-bottom:20px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:1200;overflow:hidden}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px;animation:particle .8s ease-out forwards}
.floatxp{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:700;font-size:1.25rem;color:var(--accent);text-shadow:0 2px 12px rgba(0,0,0,.7);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.floatxp.half{color:var(--orange)}
.combo{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(1.8rem,7vw,3.2rem);color:var(--gold);text-shadow:0 0 30px rgba(255,138,61,.8),0 4px 0 rgba(0,0,0,.4);animation:combo 1.2s ease-out forwards;white-space:nowrap}
.confetti{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,calc(100% + 60px));visibility:hidden;z-index:1300;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(92vw,440px);background:var(--bg2);border:1.5px solid var(--gold);border-radius:16px;padding:12px 18px;box-shadow:0 12px 40px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),visibility 0s .35s}
#toast.show{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
#toast .t-ic{font-size:1.9rem}
#toast b{display:block;font-size:.95rem}
#toast small{color:var(--text2);font-size:.8rem}

@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,77,.5)}50%{box-shadow:0 0 0 10px rgba(255,201,77,0)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%{transform:scale(.8)}35%{transform:scale(1.1) translateY(-6px)}60%{transform:scale(.97)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideUp{0%{transform:translateY(18px);opacity:0}100%{transform:none;opacity:1}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-280%)}}
@keyframes particle{100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
@keyframes fall{100%{transform:translateY(108vh) rotate(720deg)}}
@keyframes spin{100%{transform:rotate(360deg)}}

   ============================================================ */

/* ============================================================

const TRACKING = {

/* Types d'exercices : libellé, nombre d'essais, durée estimée en secondes (conventions §3.9) */
const TYPES = {
  qcm:      { label:'QCM',                tries:2, dur:40  },

  multi:    { label:'Sélection multiple', tries:2, dur:60  },

/* ----- Rotation déterministe des propositions de QCM (conventions §3.7).
   La bonne réponse est rédigée en position 0, puis déplacée. ----- */
const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste){
  let k = 0;
  liste.forEach(q => {
    if (q.type !== 'qcm') return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++) {
      q.options.unshift(q.options.pop());
      q.correct = (q.correct + 1) % q.options.length;
    }
  });
})(LEVELS.flatMap(lv => lv.questions));

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Mélange déterministe : l'ordre ne change jamais d'un rendu à l'autre (conventions §1.5) */
function shuffled(n, seed){
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* Mini-calculatrice (conventions §6.1) : liste blanche stricte avant toute évaluation */
function evalExpr(s){
  let e = String(s).replace(/\s| | |€/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.');
  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;
  try { const r = Function('"use strict";return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? r : null; }
  catch (err) { return null; }
}
function parseNum(s){
  const r = evalExpr(s); if (r !== null) return r;
  let t = String(s).replace(/\s| | |€/g, '').replace(/−/g, '-');
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g, '');
  return parseFloat(t);
}
function fmtNum(n){
  const p = Math.abs(n).toFixed(2).split('.');
  return (n < 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + p[1];
}
function calcPreview(v){
  const r = evalExpr(v || ''); if (r === null) return '';
  const shown = String(v).trim().replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−').replace(/\s+/g, '').replace(/([+−×÷])/g, ' $1 ');
  return '<span>' + esc(shown) + '</span> → <b>= ' + fmtNum(r) + '</b>';
}
function formatTime(sec){
  sec = Math.round(sec || 0); if (sec <= 0) return '—';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? m + 'm' + String(s).padStart(2, '0') + 's' : s + 's';
}
function nomEleve(){
  if (!APP.email) return 'Élève';
  return esc(APP.email.split('@')[0].split(/[._-]+/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '));
}

/* ----- Accès aux questions et à leur état ----- */
function getQ(l, q){
  const raw = LEVELS[l].questions[q];
  if (raw.variants) return Object.assign({}, raw, raw.variants[APP.scenario]);
  return raw;
}
function labelsOf(Q){ return (Q.type === 'order' ? Q.steps : Q.blanks).concat(Q.distractors || []); }
function initState(l, q){
  const Q = getQ(l, q), seed = l * 31 + q * 7 + 11;
  const st = { attempts:0, done:false, status:null, earned:0, fb:null, bounce:null };
  switch (Q.type) {
    case 'qcm':      st.sel = null; st.wrong = []; break;
    case 'vf':       st.sel = null; break;
    case 'multi':    st.picks = []; break;
    case 'input':    st.value = ''; break;
    case 'classify': st.place = {}; st.lock = {}; st.sel = null; st.order = shuffled(Q.items.length, seed); break;
    case 'match':    st.choice = {}; st.lock = {}; st.order = shuffled(Q.pairs.length + Q.distractors.length, seed); break;
    case 'order':
    case 'cloze':    st.slots = (Q.type === 'order' ? Q.steps : Q.blanks).map(() => null); st.lock = {}; st.sel = null; st.dest = null;
                     st.order = shuffled(labelsOf(Q).length, seed); break;
    case 'hunt':     st.flags = {}; st.lock = {}; st.alerts = 0; break;
  }
  return st;
}
function S(l, q){ const k = key(l, q); if (!APP.qs[k]) APP.qs[k] = initState(l, q); return APP.qs[k]; }
function cur(){ return S(APP.level, APP.q); }
function curQ(){ return getQ(APP.level, APP.q); }
function isLocked(l){ return l > 0 && !APP.done[l - 1]; }
function allDone(){ return LEVELS.every((_, l) => APP.done[l]); }
function firstOpen(l){
  const n = LEVELS[l].questions.length;
  for (let i = 0; i < n; i++) if (!S(l, i).done) return i;
  return n - 1;
}
function levelStats(l){
  const lv = LEVELS[l]; let c1 = 0, c2 = 0, c3 = 0, earned = 0;
  lv.questions.forEach((_, i) => {
    const st = APP.qs[key(l, i)]; if (!st || !st.done) return;
    earned += st.earned;
    if (st.status === 'correct') c1++; else if (st.status === 'hint') c2++; else c3++;
  });
  const n = lv.questions.length;
  return { c1, c2, c3, n, earned, pct: Math.round(c1 / n * 100) };
}
function grade(pct){
  if (pct >= 85) return { g:'A', nom:'Excellent',       msg:'Tu maîtrises cette matière : les réponses tombent juste du premier coup.' };
  if (pct >= 65) return { g:'B', nom:'Très bien',       msg:'La matière est solide. Relis les questions corrigées au deuxième essai.' };
  if (pct >= 45) return { g:'C', nom:'Satisfaisant',    msg:'La base est là. Revois les points signalés en orange et en rouge.' };
  return           { g:'D', nom:'À retravailler',  msg:'Reprends le rappel et ton cours, puis rejoue le parcours : chaque essai fait progresser.' };
}
function medal(pct){ return pct >= 90 ? '🏆' : pct >= 70 ? '🥇' : pct >= 50 ? '🥈' : '🥉'; }
function stars(pct){ const n = pct >= 85 ? 3 : pct >= 65 ? 2 : pct >= 45 ? 1 : 0; return '<span class="stars" aria-label="' + n + ' étoile' + plural(n, '', 's') + ' sur 3">' + '★'.repeat(n) + '☆'.repeat(3 - n) + '</span>'; }
function rankThreshold(i){ return Math.ceil(RANKS[i].at * TOTAL_XP); }
function rankIndex(score){ let r = 0; RANKS.forEach((_, i) => { if (score >= rankThreshold(i)) r = i; }); return r; }

/* ----- Prédiction de score (conventions §3.13) ----- */
function predCat(r){ return r >= 1 ? 'all' : r >= 0.625 ? 'most' : r >= 0.34 ? 'half' : 'low'; }
function predictOk(l){ const s = levelStats(l); return !!APP.predict[l] && predCat(s.c1 / s.n) === APP.predict[l]; }
function predSentence(l){
  const p = APP.predict[l]; if (!p) return '';
  const s = levelStats(l), cat = predCat(s.c1 / s.n), ORD = { low:0, half:1, most:2, all:3 };
  const end = cat === p ? 'Bonne estimation, tu te connais bien !'
            : ORD[cat] > ORD[p] ? 'Tu as fait mieux que prévu : tu peux te faire davantage confiance.'
            : "C'est un peu moins que prévu : regarde ci-dessous les questions qui t'ont résisté.";
  return 'Tu avais prédit <b>' + PRED[p].txt + '</b> ; tu as réussi <b>' + s.c1 + '/' + s.n + '</b> du premier coup. ' + end;
}

function setScreen(name){

  renderScreen();

function renderScreen(){
  const m = $('main'), ae = document.activeElement;
  const fk = F.focus || (ae && ae.dataset ? ae.dataset.fk : null); F.focus = null;
  switch (APP.screen) {
    case 'welcome':  m.innerHTML = renderWelcome(); break;
    case 'hub':      m.innerHTML = renderHub(); break;
    case 'brief':    m.innerHTML = renderBrief(APP.level); break;
    case 'question': m.innerHTML = renderQuestion(APP.level, APP.q); break;
    case 'bilan':    m.innerHTML = renderBilan(APP.level); break;
  }
  F.enter = false; F.fb = false; F.shake = false;
  if (fk) {   // on rend le focus clavier à l'élément équivalent, sinon au bouton « suivant »
    let t = m.querySelector('[data-fk="' + fk + '"]:not(:disabled)');
    if (!t && APP.screen === 'question' && cur().done) t = m.querySelector('[data-fk="next"]');
    if (t) { t.focus({ preventScroll:true }); if (t.id === 'ans') { const n = t.value.length; try { t.setSelectionRange(n, n); } catch (e) {} } }
  }
  updateHUD(); renderNav();
}

    else if (APP.started[l]) meta = 'En cours · question ' + (firstOpen(l) + 1) + '/' + lv.questions.length;
    else meta = lv.questions.length + ' questions · ' + lv.maxPoints + ' XP à gagner';
    h += '<div class="node-row ' + (l % 2 ? 'right' : 'left') + '">' +
      '<div class="node ' + (done ? 'done' : locked ? 'locked' : 'cur') + '" aria-hidden="true">' + (done ? '✓' : locked ? '🔒' : (l + 1)) + '</div>' +
      '<button class="lv-card' + (!done && !locked ? ' cur' : '') + '" data-act="open-level" data-l="' + l + '" data-fk="lv' + l + '" ' + (locked ? 'disabled' : '') + '>' +
        '<span class="lv-ic" aria-hidden="true">' + lv.icon + '</span>' +
        '<span class="lv-body"><b>Mission ' + (l + 1) + ' — ' + lv.title + '</b><small>' + lv.desc + '</small><span class="lv-meta">' + meta + '</span></span>' +
      '</button></div>';
  });
  h += '</div>' + renderTrophies();
  return h;
}

/* ---------- Écran question ---------- */
const BODY = {
  qcm(Q, st){
    return '<div class="opts">' + Q.options.map((o, i) => {
      const wrong = st.wrong.includes(i); let c = 'opt';
      if (st.done) { if (i === Q.correct) c += ' good' + (st.status === 'shown' ? ' reveal' : ''); else if (wrong) c += ' bad'; }
      else if (wrong) c += ' bad'; else if (st.sel === i) c += ' sel';
      return '<button class="' + c + '" data-act="opt" data-i="' + i + '" data-fk="opt' + i + '" ' + (st.done || wrong ? 'disabled' : '') + ' aria-pressed="' + (st.sel === i) + '">' +
             '<span class="letter">' + 'ABCD'[i] + '</span><span>' + o + '</span></button>';
    }).join('') + '</div>';
  },
  vf(Q, st){
    return '<div class="vf">' + [true, false].map(v => {
      let c = 'vfbtn';
      if (st.done) { if (Q.answer === v) c += ' good'; else if (st.sel === v) c += ' bad'; }
      return '<button class="' + c + '" data-act="vf" data-v="' + (v ? 1 : 0) + '" data-fk="vf' + (v ? 1 : 0) + '" ' + (st.done ? 'disabled' : '') + '>' + (v ? '✔️ Vrai' : '✖️ Faux') + '</button>';
    }).join('') + '</div>';
  },
  multi(Q, st){
    return '<div class="opts">' + Q.options.map((o, i) => {
      const picked = st.picks.includes(i), good = Q.correct.includes(i); let c = 'opt';
      if (st.done) { if (good && picked) c += ' good'; else if (good) c += ' missed'; else if (picked) c += ' bad'; }
      else if (picked) c += ' sel';
      return '<button class="' + c + '" data-act="pick" data-i="' + i + '" data-fk="pick' + i + '" role="checkbox" aria-checked="' + picked + '" ' + (st.done ? 'disabled' : '') + '>' +
             '<span class="cbx">' + (picked ? '✓' : '') + '</span><span>' + o + '</span></button>';
    }).join('') + '</div>';
  },
  input(Q, st){
    return '<div class="inp-row"><input id="ans" class="inp" type="text" inputmode="decimal" autocomplete="off" placeholder="Ta réponse ou ton calcul" value="' + esc(st.value) + '" ' +
           (st.done ? 'disabled' : '') + ' data-fk="ans" aria-label="Ta réponse">' + (Q.unit ? '<span class="unit">' + Q.unit + '</span>' : '') + '</div>' +
      (st.done ? '' : '<div class="ops" aria-label="Touches de calcul">' + ['+', '−', '×', '÷', '(', ')'].map(o => '<button class="op" data-act="op" data-o="' + o + '" tabindex="-1" aria-label="Insérer ' + o + '">' + o + '</button>').join('') + '</div>') +
      '<div class="calc" id="calc" aria-live="polite">' + calcPreview(st.value) + '</div>';
  },
  classify(Q, st){
    const reserve = st.order.filter(i => st.place[i] == null);
    let h = '<p class="how">Clique une étiquette, puis la zone où tu veux la ranger. Clique une étiquette déjà rangée pour la reprendre.</p>';
    h += '<div class="reserve" aria-label="Étiquettes à ranger">' + (reserve.length ? reserve.map(i =>
      '<button class="lab' + (st.sel === i ? ' sel' : '') + (st.bounce && st.bounce[i] ? ' bounce' : '') + '" data-act="lab" data-i="' + i + '" data-fk="lab' + i + '" aria-pressed="' + (st.sel === i) + '">' + Q.items[i].t + '</button>').join('')
      : '<span class="empty">Toutes les étiquettes sont rangées.</span>') + '</div>';
    h += '<div class="zones n' + Q.zones.length + '">' + Q.zones.map((z, zi) => {
      const inz = st.order.filter(i => st.place[i] === zi);
      return '<div class="zone' + (st.sel != null && !st.done ? ' ready' : '') + '" data-act="zone" data-z="' + zi + '">' +
        '<button class="zone-h" data-act="zone" data-z="' + zi + '" data-fk="zone' + zi + '" ' + (st.done ? 'disabled' : '') + '>' + z + '</button><div class="zone-items">' +
        inz.map(i => {
          const lk = st.lock[i];
          if (lk) return '<span class="lab lock ' + lk + '">' + Q.items[i].t + (lk === 'r' ? '<em class="fix">→ ' + Q.zones[Q.items[i].z] + '</em>' : '') + '</span>';
          return '<button class="lab" data-act="unplace" data-i="' + i + '" data-fk="lab' + i + '">' + Q.items[i].t + '</button>';
        }).join('') + '</div></div>';
    }).join('') + '</div>';
    return h;
  },
  match(Q, st){
    const rights = Q.pairs.map(p => p.r).concat(Q.distractors);
    return '<div class="match">' + Q.pairs.map((p, i) => {
      const lk = st.lock[i], ch = st.choice[i];
      return '<div class="m-row' + (lk ? ' lock ' + lk : '') + (st.bounce && st.bounce[i] ? ' bounce' : '') + '"><div class="m-left">' + p.l + '</div><div class="m-right">' +
        '<select data-chg="match" data-i="' + i + '" data-fk="sel' + i + '" ' + (lk ? 'disabled' : '') + ' aria-label="Rôle de ' + esc(stripTags(p.l)) + '">' +
        '<option value="">— choisir —</option>' + st.order.map(o => '<option value="' + o + '"' + (ch === o ? ' selected' : '') + '>' + esc(rights[o]) + '</option>').join('') + '</select>' +
        (lk === 'r' ? '<em class="fix">→ ' + rights[i] + '</em>' : '') + '</div></div>';
    }).join('') + '</div>';
  },
  order(Q, st){
    const labels = labelsOf(Q);
    return '<p class="how">Clique une étiquette, puis son emplacement numéroté. Attention : ' + Q.distractors.length + ' étiquettes ne servent pas.</p>' +
      reserveHtml(Q, st, labels) +
      '<ol class="slots">' + st.slots.map((v, s) => {
        const lk = st.lock[s];
        const c = 'slot' + (lk ? ' lock ' + lk : '') + (v == null ? ' empty' : '') + (st.dest === s ? ' dest' : '');
        const inner = v == null ? '<span class="ph">…</span>'
          : '<span><span' + (lk === 'r' ? ' class="strike"' : '') + '>' + labels[v] + '</span>' + (lk === 'r' ? '<em class="fix">✏️ ' + labels[s] + '</em>' : '') + '</span>';
        return '<li><button class="' + c + '" data-act="slot" data-s="' + s + '" data-fk="slot' + s + '" ' + (lk || st.done ? 'disabled' : '') + ' aria-label="Étape ' + (s + 1) + '">' +
               '<span class="num">' + (s + 1) + '</span>' + inner + '</button></li>';
      }).join('') + '</ol>';
  },
  cloze(Q, st){
    const labels = labelsOf(Q);
    const txt = Q.text.replace(/\{(\d+)\}/g, (m, n) => {
      const s = +n, v = st.slots[s], lk = st.lock[s];
      const c = 'blank' + (lk ? ' lock ' + lk : '') + (v == null ? ' empty' : '') + (st.dest === s ? ' dest' : '');
      const inner = v == null ? '&nbsp;' : (lk === 'r' ? '<s>' + labels[v] + '</s> <em class="fix">' + labels[s] + '</em>' : labels[v]);
      return '<button class="' + c + '" data-act="slot" data-s="' + s + '" data-fk="slot' + s + '" ' + (lk || st.done ? 'disabled' : '') + ' aria-label="Trou ' + (s + 1) + '">' + inner + '</button>';
    });
    return '<p class="how">Clique un mot, puis le trou où tu veux le placer. Clique un trou rempli pour le vider.</p>' +
      reserveHtml(Q, st, labels) + '<div class="cloze">' + txt + '</div>';
  },
  hunt(Q, st){
    return '<p class="how">Clique les phrases qui contiennent une erreur. Attention : chaque fausse alerte coûte 1 XP.</p>' +
      '<div class="paper"><div class="paper-h">' + Q.docTitle + '</div>' + Q.sentences.map((s, i) => {
        const lk = st.lock[i], fl = !!st.flags[i];
        const c = 'sent' + (lk ? ' lock ' + lk : '') + (fl && !lk ? ' flag' : '') + (st.bounce && st.bounce[i] ? ' bounce' : '');
        return '<button class="' + c + '" data-act="flag" data-i="' + i + '" data-fk="sent' + i + '" ' + (lk || st.done ? 'disabled' : '') + ' aria-pressed="' + fl + '">' +
          '<span class="s-ic" aria-hidden="true">' + (lk ? (lk === 'r' ? '👁' : '✔️') : (fl ? '🚩' : '•')) + '</span>' +
          '<span>' + s.t + (lk ? '<em class="fix">✏️ ' + s.fix + '</em>' : '') + '</span></button>';
      }).join('') + '</div>';
  }
};
function reserveHtml(Q, st, labels){
  const used = st.slots.filter(v => v != null);
  const res = st.order.filter(i => !used.includes(i));
  return '<div class="reserve" aria-label="Réserve d\'étiquettes">' + (res.length ? res.map(i =>
    '<button class="lab' + (st.sel === i ? ' sel' : '') + (st.bounce && st.bounce[i] ? ' bounce' : '') + '" data-act="lab" data-i="' + i + '" data-fk="lab' + i + '" ' +
    (st.done ? 'disabled' : '') + ' aria-pressed="' + (st.sel === i) + '">' + labels[i] + '</button>').join('') : '<span class="empty">La réserve est vide.</span>') + '</div>';
}
function canVerify(Q, st){
  switch (Q.type) {
    case 'qcm':      return st.sel != null;
    case 'multi':    return st.picks.length > 0;
    case 'input':    return true;
    case 'classify': return Q.items.every((_, i) => st.place[i] != null);
    case 'match':    return Q.pairs.every((_, i) => st.choice[i] != null);
    case 'order':
    case 'cloze':    return st.slots.every(v => v != null);
    case 'hunt':     return st.attempts > 0 || Object.keys(st.flags).some(i => st.flags[i]);
  }
  return false;
}
function renderQuestion(l, q){
  const lv = LEVELS[l], Q = getQ(l, q), st = S(l, q), T = TYPES[Q.type];
  let h = '<div class="q-top"><button class="link" data-act="hub">← Parcours</button><span class="q-count">Mission ' + (l + 1) + ' · Question ' + (q + 1) + '/' + lv.questions.length + '</span></div>';
  h += '<div class="dots" aria-hidden="true">' + lv.questions.map((_, i) => {
    const s = APP.qs[key(l, i)];
    return '<span class="dot ' + (s && s.done ? s.status : (i === q ? 'cur' : '')) + '"></span>';
  }).join('') + '</div>';
  h += '<section class="card qcard' + (F.enter ? ' enter' : '') + (F.shake ? ' shake' : '') + '">';
  h += '<div class="q-tag">' + T.label + ' — ' + (T.tries > 1 ? T.tries + ' essais' : '1 essai') + ' · ' + Q.pts + ' XP</div>';
  h += '<h2 class="q-text">' + Q.q + '</h2>';
  if (Q.data) h += '<div class="data">' + Q.data + '</div>';
  if (Q.doc)  h += Q.doc;
  h += BODY[Q.type](Q, st);
  if (st.fb) h += '<div class="fb ' + st.fb.kind + (F.fb ? ' fresh' : '') + '" role="status">' + st.fb.html + '</div>';
  if (st.done) {
    const last = q === lv.questions.length - 1;
    h += '<div class="actions end"><button class="btn primary" data-act="next" data-fk="next">' + (last ? 'Voir le bilan ➜' : 'Question suivante ➜') + '</button></div>';
  } else if (Q.type !== 'vf') {
    h += '<div class="actions end"><span class="tries">' + (st.attempts === 0 ? '1er essai' : '2e et dernier essai') + '</span>' +
         '<button class="btn primary" data-act="verify" data-fk="verify" ' + (canVerify(Q, st) ? '' : 'disabled') + '>Vérifier</button></div>';
  }
  return h + '</section>';
}

/* ---------- Bilan final par critères et indicateurs (conventions §4.11) ---------- */
function bilanIndicateurs(){
  const acc = {};
  LEVELS.forEach((lv, l) => lv.questions.forEach((q, i) => {
    const a = acc[q.ind] || (acc[q.ind] = { pts:0, max:0 });
    a.max += q.pts;
    a.pts += (APP.qs[l + '_' + i] && APP.qs[l + '_' + i].earned) || 0;
  }));
  const statut = r => r >= 0.8 ? 'atteint' : r >= 0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => {
      const a = acc[ind.id] || { pts:0, max:0 };
      const r = a.max ? a.pts / a.max : 0;
      return Object.assign({}, ind, { ratio:r, statut:statut(r) });
    });
    const tot = c.indicateurs.reduce((t, ind) => {
      const a = acc[ind.id] || { pts:0, max:0 };
      return { pts:t.pts + a.pts, max:t.max + a.max };
    }, { pts:0, max:0 });
    const r = tot.max ? tot.pts / tot.max : 0;
    return { id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds };
  });
}
function renderFiche(){
  const B = bilanIndicateurs();
  const ST = { atteint:['✅', 'Atteint'], encours:['🟠', "En cours d'acquisition"], nonatteint:['❌', 'Non atteint'] };
  const allOk = B.every(c => c.indicateurs.every(i => i.statut === 'atteint'));
  const date = new Date().toLocaleDateString('fr-BE', { day:'numeric', month:'long', year:'numeric' });

    B.map(c => '<div class="crit ' + c.statut + '"><div class="crit-h"><span>' + ST[c.statut][0] + '</span><b>' + c.nom + '</b><em>' + ST[c.statut][1] + ' · ' + Math.round(c.ratio * 100) + ' %</em></div><ul>' +

}

function fbShown(Q, ans){ return { kind:'ko', html:'<b>👁 La bonne réponse :</b> ' + ans + '<br>' + Q.explain }; }
function miss(){ APP.streak = 0; F.shake = true; SFX.ko(); }

/* Fin d'une question : points, série, récompenses, badges, rang, fin de mission */
function finish(l, q, status, earned){
  const st = S(l, q);
  st.done = true; st.status = status; st.earned = earned; st.sel = null; st.dest = null;
  APP.score += earned;
  if (status === 'correct') {
    APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak);
    fxParticles(PT.x, PT.y); fxFloat(PT.x, PT.y, '+' + earned + ' XP'); SFX.ok();
    if (APP.streak >= 3 && rankIndex(APP.score) <= APP.rankIdx) fxCombo(APP.streak);   // pas de combo par-dessus une montée en grade
  } else {
    APP.streak = 0;
    if (earned > 0) { fxFloat(PT.x, PT.y, '+' + earned + ' XP', 'half'); if (status === 'hint') SFX.ok(); }
    if (status === 'shown') { F.shake = true; SFX.ko(); }
  }
  if (LEVELS[l].questions.every((_, i) => S(l, i).done)) completeLevel(l);
  checkBadges();
  checkRank();
}

/* Barème par élément, commun à tous les exercices à éléments (conventions §3.8) */
function itemFinish(l, q, n, penalty){
  const Q = getQ(l, q), st = S(l, q), val = Q.pts / n, locks = Object.values(st.lock);
  const g = locks.filter(x => x === 'g').length, o = locks.filter(x => x === 'o').length, r = locks.filter(x => x === 'r').length;
  penalty = penalty || 0;
  const earned = Math.max(0, g * val + o * val / 2 - penalty);
  const status = (r === 0 && o === 0 && penalty === 0) ? 'correct' : (r === 0 ? 'hint' : 'shown');
  const pen = penalty ? ' ' + penalty + ' fausse' + plural(penalty, '', 's') + ' alerte' + plural(penalty, '', 's') + ' : −' + penalty + ' XP.' : '';
  const hunt = Q.type === 'hunt';
  if (status === 'correct') st.fb = fbOk(Q);
  else if (status === 'hint') st.fb = { kind:'ok2', html:'<b>🔄 ' + (o ? 'Tout est juste après correction.' : 'Toutes les erreurs sont trouvées.') + '</b>' + pen + ' ' + Q.explain };
  else st.fb = { kind:'ko', html:'<b>👁 ' + (g + o) + ' ' + (hunt ? plural(g + o, 'erreur trouvée', 'erreurs trouvées') : plural(g + o, 'élément juste', 'éléments justes')) + ' sur ' + n + '.</b>' + pen +
                 ' Les corrections sont affichées en rouge. ' + Q.explain };
  finish(l, q, status, earned);
}
function itemHint(Q, ok, n){
  const head = ok === 0 ? "Aucun élément n'est encore juste." : ok + ' ' + plural(ok, 'élément', 'éléments') + ' sur ' + n + ' ' + plural(ok, 'est juste et verrouillé', 'sont justes et verrouillés') + '.';
  return { kind:'hint', html:'<b>💡 ' + head + '</b> Les autres retournent dans la réserve : il te reste un essai. ' + (Q.hint || '') };
}

const VERIFY = {
  qcm(l, q, Q, st){
    if (st.sel == null) return;
    if (st.sel === Q.correct) { st.fb = fbOk(Q, st.attempts); finish(l, q, st.attempts ? 'hint' : 'correct', st.attempts ? Q.pts / 2 : Q.pts); return; }
    st.wrong.push(st.sel); st.sel = null; st.attempts++;
    if (st.attempts >= 2) { st.fb = fbShown(Q, Q.options[Q.correct]); finish(l, q, 'shown', 0); }
    else { st.fb = fbHint(Q); miss(); }
  },
  multi(l, q, Q, st){
    if (!st.picks.length) return;
    const good = st.picks.filter(i => Q.correct.includes(i)).length, extra = st.picks.length - good;
    if (good === Q.correct.length && extra === 0) { st.fb = fbOk(Q, st.attempts); finish(l, q, st.attempts ? 'hint' : 'correct', st.attempts ? Q.pts / 2 : Q.pts); return; }
    st.attempts++;
    if (st.attempts >= 2) { st.fb = fbShown(Q, Q.correct.map(i => Q.options[i]).join(' · ')); finish(l, q, 'shown', 0); }
    else {
      st.fb = fbHint(Q, (good ? good + ' de tes réponses ' + plural(good, 'est juste', 'sont justes') : "Aucune de tes réponses n'est juste") +
        ' ; il y en a ' + Q.correct.length + ' à trouver' + (extra ? ', et tu en as coché ' + extra + ' de trop' : '') + '. ');
      miss();
    }
  },
  input(l, q, Q, st){
    const v = parseNum(st.value);
    if (st.value.trim() === '' || isNaN(v)) { st.fb = { kind:'hint', html:'Écris un nombre ou un calcul dans le champ avant de vérifier.' }; return; }
    if (Math.abs(v - Q.answer) <= (Q.tol || 0.02) + 1e-9) { st.fb = fbOk(Q, st.attempts); finish(l, q, st.attempts ? 'hint' : 'correct', st.attempts ? Q.pts / 2 : Q.pts); return; }
    st.attempts++;
    if (st.attempts >= 2) { st.fb = fbShown(Q, fmtNum(Q.answer) + (Q.unit ? ' ' + Q.unit : '')); finish(l, q, 'shown', 0); }
    else { st.fb = fbHint(Q); miss(); F.focus = 'ans'; }
  },
  classify(l, q, Q, st){
    const n = Q.items.length; if (!canVerify(Q, st)) return;
    st.bounce = {}; st.sel = null; let wrong = 0;
    Q.items.forEach((it, i) => {
      if (st.lock[i]) return;
      if (st.place[i] === it.z) st.lock[i] = st.attempts ? 'o' : 'g';
      else { wrong++; if (st.attempts) st.lock[i] = 'r'; else { delete st.place[i]; st.bounce[i] = true; } }
    });
    if (wrong === 0 || st.attempts >= 1) itemFinish(l, q, n);
    else { st.attempts = 1; st.fb = itemHint(Q, n - wrong, n); miss(); }
  },
  match(l, q, Q, st){
    const n = Q.pairs.length; if (!canVerify(Q, st)) return;
    st.bounce = {}; let wrong = 0;
    Q.pairs.forEach((p, i) => {
      if (st.lock[i]) return;
      if (st.choice[i] === i) st.lock[i] = st.attempts ? 'o' : 'g';
      else { wrong++; if (st.attempts) st.lock[i] = 'r'; else { delete st.choice[i]; st.bounce[i] = true; } }
    });
    if (wrong === 0 || st.attempts >= 1) itemFinish(l, q, n);
    else { st.attempts = 1; st.fb = itemHint(Q, n - wrong, n); miss(); }
  },
  slots(l, q, Q, st){
    const n = st.slots.length; if (!canVerify(Q, st)) return;
    st.bounce = {}; st.sel = null; st.dest = null; let wrong = 0;
    st.slots.forEach((v, s) => {
      if (st.lock[s]) return;
      if (v === s) st.lock[s] = st.attempts ? 'o' : 'g';
      else { wrong++; if (st.attempts) st.lock[s] = 'r'; else { st.bounce[v] = true; st.slots[s] = null; } }
    });
    if (wrong === 0 || st.attempts >= 1) itemFinish(l, q, n);
    else { st.attempts = 1; st.fb = itemHint(Q, n - wrong, n); miss(); }
  },
  hunt(l, q, Q, st){
    const errs = Q.sentences.map((s, i) => s.wrong ? i : -1).filter(i => i >= 0), n = errs.length;
    const flagged = Object.keys(st.flags).map(Number).filter(i => st.flags[i] && !st.lock[i]);
    if (st.attempts === 0 && !flagged.length) return;
    st.bounce = {}; let fa = 0;
    flagged.forEach(i => {
      if (Q.sentences[i].wrong) st.lock[i] = st.attempts ? 'o' : 'g';
      else { fa++; st.bounce[i] = true; }       // fausse alerte : −1 XP
      delete st.flags[i];
    });
    st.alerts += fa;
    const left = errs.filter(i => !st.lock[i]);
    if (!left.length || st.attempts >= 1) { left.forEach(i => { st.lock[i] = 'r'; }); itemFinish(l, q, n, st.alerts); }
    else {
      st.attempts = 1; const found = n - left.length;
      st.fb = { kind:'hint', html:'<b>💡 Tu as trouvé ' + found + ' ' + plural(found, 'erreur', 'erreurs') + ' sur ' + n + '.</b>' +
        (fa ? ' ' + fa + ' fausse' + plural(fa, '', 's') + ' alerte' + plural(fa, '', 's') + ' : −' + fa + ' XP.' : '') + ' Il en reste : relis chaque phrase. ' + (Q.hint || '') };
      miss();
    }
  }
};
VERIFY.order = VERIFY.slots; VERIFY.cloze = VERIFY.slots;

/* ============================================================
   8. ACTIONS (délégation d'événements)
   ============================================================ */
const ACT = {
  home(){ setScreen(Object.keys(APP.started).length ? 'hub' : 'welcome'); },
  start(){ setScreen('hub'); },
  hub(){
    const first = allDone() && !APP.celebrated.final;
    setScreen('hub');
    if (first) { APP.celebrated.final = true; SFX.level(); if (Math.round(LEVELS.reduce((s, _, l) => s + levelStats(l).c1, 0) / TOTAL_Q * 100) >= 70) confetti(); }
  },
  'open-level'(el){
    const l = +el.dataset.l; if (isLocked(l)) return;
    APP.level = l;
    if (APP.done[l]) return setScreen('bilan');
    if (APP.started[l]) { APP.q = firstOpen(l); return setScreen('question'); }
    if (!APP.levelStart[l]) APP.levelStart[l] = Date.now();   // le chronomètre du niveau démarre au briefing
    setScreen('brief');
  },
  predict(el){ APP.predict[APP.level] = el.dataset.v; F.focus = 'go'; renderScreen(); },
  go(){ const l = APP.level; if (!APP.predict[l]) return; APP.started[l] = true; APP.q = firstOpen(l); setScreen('question'); },
  opt(el){ const st = cur(); if (st.done) return; st.sel = +el.dataset.i; renderScreen(); },
  vf(el){
    const l = APP.level, q = APP.q, Q = curQ(), st = cur(); if (st.done) return;
    st.sel = el.dataset.v === '1';
    if (st.sel === Q.answer) { st.fb = { kind:'ok', html:'<b>✅ Exact : c\'est ' + (Q.answer ? 'vrai' : 'faux') + '.</b> ' + Q.explain }; F.fb = true; finish(l, q, 'correct', Q.pts); }
    else { st.fb = { kind:'ko', html:'<b>👁 C\'était ' + (Q.answer ? 'vrai' : 'faux') + '.</b> ' + Q.explain }; F.fb = true; finish(l, q, 'shown', 0); }
    renderScreen();
  },
  pick(el){ const st = cur(); if (st.done) return; const i = +el.dataset.i, k = st.picks.indexOf(i); if (k >= 0) st.picks.splice(k, 1); else st.picks.push(i); renderScreen(); },
  op(el){
    const st = cur(); if (st.done) return; const inp = $('ans');
    st.value = (inp ? inp.value : st.value) + el.dataset.o; F.focus = 'ans'; renderScreen();
  },
  lab(el){
    const Q = curQ(), st = cur(); if (st.done) return; const i = +el.dataset.i; st.bounce = null;
    if (Q.type !== 'classify' && st.dest != null) { st.slots[st.dest] = i; F.focus = 'slot' + st.dest; st.dest = null; st.sel = null; }
    else st.sel = st.sel === i ? null : i;
    renderScreen();
  },
  zone(el){ const st = cur(); if (st.done || st.sel == null) return; st.bounce = null; st.place[st.sel] = +el.dataset.z; F.focus = 'lab' + st.sel; st.sel = null; renderScreen(); },
  unplace(el){
    const st = cur(); if (st.done) return; const i = +el.dataset.i; if (st.lock[i]) return; st.bounce = null;
    if (st.sel != null) { st.place[st.sel] = st.place[i]; st.sel = null; }   // une étiquette est en main : on la range dans cette zone
    else delete st.place[i];
    renderScreen();
  },
  slot(el){
    const st = cur(); if (st.done) return; const s = +el.dataset.s; if (st.lock[s]) return; st.bounce = null;
    if (st.sel != null) { st.slots[s] = st.sel; st.sel = null; st.dest = null; }
    else if (st.slots[s] != null) st.slots[s] = null;
    else st.dest = st.dest === s ? null : s;
    renderScreen();
  },
  flag(el){ const st = cur(); if (st.done) return; const i = +el.dataset.i; if (st.lock[i]) return; st.bounce = null; if (st.flags[i]) delete st.flags[i]; else st.flags[i] = true; renderScreen(); },
  verify(){
    const l = APP.level, q = APP.q, Q = curQ(), st = cur(); if (st.done) return;
    if (Q.type === 'input') { const inp = $('ans'); if (inp) st.value = inp.value; }
    F.fb = true;
    VERIFY[Q.type](l, q, Q, st);
    renderScreen();
  },
  next(){
    const l = APP.level; if (!cur().done) return;
    if (APP.q < LEVELS[l].questions.length - 1) { APP.q++; setScreen('question'); return; }
    setScreen('bilan');
    if (!APP.celebrated[l]) { APP.celebrated[l] = true; SFX.level(); if (levelStats(l).pct >= 70) confetti(); }
  },
  'next-level'(){ const l = APP.level + 1; if (l < LEVELS.length) ACT['open-level']({ dataset:{ l:String(l) } }); },
  replay(){ if (window.confirm('Rejouer tout le parcours ? Tes XP repartent de zéro et une nouvelle partie est enregistrée.')) restartGame(); },
  print(){ window.print(); },
  sound(){
    APP.sound = !APP.sound; const b = $('hudSound');
    b.textContent = APP.sound ? '🔊' : '🔇'; b.setAttribute('aria-pressed', APP.sound); b.title = APP.sound ? 'Son activé' : 'Son coupé';
    if (APP.sound) SFX.ok();
  },
  'rank-close'(){ $('rankOverlay').hidden = true; pumpToast(); },
  'email-ok'(){ validateEmail(); },
  'lb-open'(el){ openLB(el.dataset.t); },
  'lb-tab'(el){ switchLBTab(el.dataset.t); },
  'lb-close'(){ closeLB(); },
  'lb-bg'(el, e){ if (e.target === el) closeLB(); },
  'lb-retry'(el){ fetchLeaderboard(el.dataset.t); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (!$('emailOverlay').hidden && act !== 'email-ok') return;      // rien n'est accessible avant l'identification
  if (e.clientX || e.clientY) { PT.x = e.clientX; PT.y = e.clientY; }
  else { const r = el.getBoundingClientRect(); PT.x = r.left + r.width / 2; PT.y = r.top + r.height / 2; }
  if (ACT[act]) ACT[act](el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest ? e.target.closest('[data-chg]') : null; if (!el) return;
  if (el.dataset.chg === 'match') {
    const st = cur(); if (st.done) return; const i = +el.dataset.i; st.bounce = null;
    if (el.value === '') delete st.choice[i]; else st.choice[i] = +el.value;
    renderScreen();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'ans') { const st = cur(); st.value = e.target.value; $('calc').innerHTML = calcPreview(st.value); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ans') { e.preventDefault(); ACT.verify(); }
  else if (e.key === 'Enter' && e.target.id === 'emailInput') { e.preventDefault(); validateEmail(); }
  else if (e.key === 'Escape' && !$('lbOverlay').hidden) closeLB();
});
window.addEventListener('beforeunload', e => {
  if (Object.keys(APP.started).length && !allDone()) { e.preventDefault(); e.returnValue = ''; }
});

/* ============================================================
   9. BADGES, RANGS, MISSION TERMINÉE
   ============================================================ */
function completeLevel(l){
  if (APP.done[l]) return;                         // anti-doublon : un niveau n'est envoyé qu'une fois par partie
  APP.done[l] = true;
  const lv = LEVELS[l], r = levelStats(l);
  const temps = APP.levelStart[l] ? Math.round((Date.now() - APP.levelStart[l]) / 1000) : 0;
  APP.levelTimes[l] = temps;
  sendResult('Mission ' + (l + 1) + ' — ' + lv.title, r.earned, lv.maxPoints, temps);
}
function award(id){
  if (APP.badges[id]) return; APP.badges[id] = true;
  const b = BADGES.find(x => x.id === id);
  toast('<span class="t-ic">' + b.icon + '</span><span><b>Badge débloqué : ' + b.nom + '</b><small>' + b.cond + '</small></span>');
}
function checkBadges(){
  if (APP.done[0]) award('depart');
  if (APP.bestStreak >= 5) award('serie5');
  LEVELS.forEach((lv, l) => {
    lv.questions.forEach((Q, i) => { const st = APP.qs[key(l, i)]; if (Q.badge && st && st.status === 'correct') award(Q.badge); });
    if (!APP.done[l]) return;
    if (levelStats(l).earned === lv.maxPoints) award('sansfaute');
    if (predictOk(l)) award('pronostic');
  });
  if (allDone()) { award('boucle'); if (APP.score >= 0.85 * TOTAL_XP) award('expert'); }
}
function checkRank(){
  const ri = rankIndex(APP.score); if (ri <= APP.rankIdx) return;
  APP.rankIdx = ri; const R = RANKS[ri];
  $('rankIcon').textContent = R.icon; $('rankName').textContent = R.nom; $('rankText').textContent = R.txt;
  $('rankOverlay').hidden = false; SFX.level(); confetti();
  setTimeout(() => { const b = $('rankBtn'); if (b && !$('rankOverlay').hidden) b.focus({ preventScroll:true }); }, 60);
}

/* Annonces de badges : une seule à la fois, en file d'attente */
const TOASTS = []; let toastBusy = false;
function toast(html){ TOASTS.push(html); pumpToast(); }
function pumpToast(){
  if (toastBusy || !TOASTS.length || !$('rankOverlay').hidden) return;
  toastBusy = true; const t = $('toast');
  t.innerHTML = TOASTS.shift(); t.classList.add('show'); SFX.badge();
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => { toastBusy = false; pumpToast(); }, 380); }, 3000);
}

/* ============================================================
   10. EFFETS ET SONS (sons coupés par défaut)
   ============================================================ */
function fxParticles(x, y){
  if (REDUCED) return; const fx = $('fx'), cols = ['#22d68a', '#5b8cff', '#ffc94d', '#ff8a3d', '#9d7bff'];
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
    p.className = 'particle';
    p.style.cssText = 'left:' + x + 'px;top:' + y + 'px;background:' + cols[i % cols.length] + ';--dx:' + (Math.cos(a) * d) + 'px;--dy:' + (Math.sin(a) * d) + 'px';
    fx.appendChild(p); setTimeout(() => p.remove(), 850);
  }
}
function fxFloat(x, y, txt, cls){
  const f = document.createElement('div'); f.className = 'floatxp' + (cls ? ' ' + cls : ''); f.textContent = txt;
  f.style.left = x + 'px'; f.style.top = y + 'px'; $('fx').appendChild(f); setTimeout(() => f.remove(), 1150);
}
function fxCombo(n){
  document.querySelectorAll('#fx .combo').forEach(x => x.remove());
  const c = document.createElement('div'); c.className = 'combo';
  c.textContent = n >= 10 ? '⚡ INARRÊTABLE ×' + n : n >= 5 ? 'EN FEU ×' + n : '🔥 COMBO ×' + n;
  $('fx').appendChild(c); setTimeout(() => c.remove(), 1250);
}
function confetti(){
  if (REDUCED) return; const fx = $('fx'), cols = ['#22d68a', '#5b8cff', '#ffc94d', '#ff8a3d', '#9d7bff', '#ff5470'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.cssText = 'left:' + (Math.random() * 100) + '%;background:' + cols[i % cols.length] + ';animation-duration:' + (2.2 + Math.random() * 1.8) + 's;animation-delay:' + (Math.random() * .5) + 's';
    fx.appendChild(c); setTimeout(() => c.remove(), 4700);
  }
}
let AC = null;
function tone(freq, start, dur, type, vol){
  if (!APP.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + start;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const SFX = {
  ok(){ tone(660, 0, .12); tone(990, .1, .2); },
  ko(){ tone(196, 0, .22, 'triangle', .1); },
  badge(){ tone(784, 0, .12); tone(988, .12, .12); tone(1319, .24, .26); },
  level(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .22)); }
};

/* ============================================================
   11. TRACKING : identification, chronomètres, envoi, classements
   (SPEC_Tracking_Eleves_v5 — GET en JSONP uniquement, jamais fetch)
   ============================================================ */
function showEmailModal(){
  $('emailOverlay').hidden = false; $('hud').inert = true; $('main').inert = true;
  const input = $('emailInput'), saved = lsGet('student_email');
  if (saved) input.value = saved;
  $('emailError').textContent = '';
  setTimeout(() => input.focus(), 80);
}
function validateEmail(){
  const input = $('emailInput'), btn = $('emailBtn'), err = $('emailError');
  const email = input.value.trim().toLowerCase();
  if (btn.disabled) return;
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    err.textContent = '⚠️ Entre une adresse e-mail valide.'; input.classList.add('err'); return;
  }
  btn.textContent = '⏳ Vérification…'; btn.disabled = true; err.textContent = ''; input.classList.remove('err');
  const cbName = '_emailCb_' + Date.now();
  const reset = () => { btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false; };
  const clean = () => { delete window[cbName]; const s = $(cbName); if (s) s.remove(); };
  const timeout = setTimeout(() => { clean(); reset(); err.textContent = '⚠️ Connexion impossible. Vérifie ta connexion internet.'; }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); clean(); reset();
    if (resp && resp.found) {
      lsSet('student_email', email); lsSet('student_classe', resp.classe || '');
      APP.email = email; APP.classe = resp.classe || '';
      TRACKING.sessionId = new Date().toISOString();            // une session par lancement
      $('emailOverlay').hidden = true; $('hud').inert = false; $('main').inert = false;
      startGlobalTimer();
      renderScreen();
      const b = document.querySelector('[data-fk="start"]'); if (b) b.focus({ preventScroll:true });
    } else {
      err.textContent = "⚠️ Cette adresse e-mail n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
      input.classList.add('err');
    }
  };
  const s = document.createElement('script');
  s.id = cbName;
  s.src = TRACKING.scriptUrl + '?action=check_email&email=' + encodeURIComponent(email) + '&callback=' + cbName;
  s.onerror = () => { clearTimeout(timeout); clean(); reset(); err.textContent = '⚠️ Erreur de connexion au serveur.'; };
  document.body.appendChild(s);
}

function startGlobalTimer(){
  APP.globalTimerStart = Date.now();
  $('globalTimer').hidden = false;
  clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval = setInterval(updateTimerDisplay, 1000);
  updateTimerDisplay();
}
function updateTimerDisplay(){
  if (!APP.globalTimerStart) return;
  const e = Math.floor((Date.now() - APP.globalTimerStart) / 1000);
  $('globalTimer').textContent = '⏱️ ' + String(Math.floor(e / 60)).padStart(2, '0') + ':' + String(e % 60).padStart(2, '0');
}

function sendResult(niveau, points, pointsMax, temps){
  if (!APP.email) return;
  const payload = {
    email: APP.email, classe: APP.classe, app: TRACKING.appName, niveau: niveau,
    points: points, pointsMax: pointsMax, temps: temps,
    totalNiveaux: TRACKING.totalNiveaux, sessionId: TRACKING.sessionId
  };
  try {
    fetch(TRACKING.scriptUrl, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify(payload) })
      .catch(err => console.warn('[TRACKING] Erreur :', err));
  } catch (err) { console.warn('[TRACKING] Erreur :', err); }
}

function restartGame(){
  TRACKING.sessionId = new Date().toISOString();                 // ⚠️ nouvelle partie = nouvelle session
  Object.assign(APP, freshState());
  TOASTS.length = 0;
  startGlobalTimer();
  setScreen('hub');
}

/* ----- Classements ----- */
let currentLBTab = 'app';
function openLB(tab){ $('lbOverlay').hidden = false; switchLBTab(tab || 'app'); }
function closeLB(){ $('lbOverlay').hidden = true; }
function switchLBTab(tab){
  currentLBTab = tab;
  $('lbTabApp').classList.toggle('on', tab === 'app');
  $('lbTabGlobal').classList.toggle('on', tab === 'global');
  const cl = APP.classe ? ' (' + APP.classe + ')' : '';
  $('lbTitle').textContent = tab === 'app' ? '🏆 Classement — ' + TRACKING.appName + cl : '🌍 Classement général' + cl;
  fetchLeaderboard(tab);
}
function lbError(tab, msg){
  $('lbContent').innerHTML = '<div class="lb-msg"><div style="color:var(--error);margin-bottom:12px">⚠️ ' + msg + '</div>' +
    '<button class="btn ghost" data-act="lb-retry" data-t="' + tab + '">Réessayer</button></div>';
}
function fetchLeaderboard(tab){
  const content = $('lbContent');
  content.innerHTML = '<div class="lb-msg"><div class="spin"></div>Chargement…</div>';
  const cbName = '_lbCb_' + Date.now();
  const clean = () => { delete window[cbName]; const s = $(cbName); if (s) s.remove(); };
  const timeout = setTimeout(() => { clean(); if (currentLBTab === tab) lbError(tab, 'Connexion impossible'); }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); clean();
    if (currentLBTab !== tab) return;
    const lbData = resp && (resp.leaderboard || resp.data);
    if (!lbData || lbData.length === 0) { content.innerHTML = '<div class="lb-msg">🏁 Aucun résultat pour le moment</div>'; return; }
    renderLeaderboard(lbData, tab);
  };
  let url = TRACKING.scriptUrl + '?action=' + (tab === 'app' ? 'leaderboard_app' : 'leaderboard_global') + '&callback=' + cbName + '&mode=last';
  if (tab === 'app') url += '&app=' + encodeURIComponent(TRACKING.appName);
  if (APP.classe) url += '&classe=' + encodeURIComponent(APP.classe);     // classement de la même classe uniquement
  const s = document.createElement('script');
  s.id = cbName; s.src = url;
  s.onerror = () => { clearTimeout(timeout); clean(); if (currentLBTab === tab) lbError(tab, 'Erreur de connexion'); };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab){
  const myEmail = (APP.email || '').toLowerCase();
  const pctOf = row => row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0);
  const tempsOf = row => row.totalTemps || row.totalTime || 0;
  if (tab === 'global') {          // classement général : tri par pourcentage, côté client
    data = data.slice().sort((a, b) => (pctOf(b) - pctOf(a)) || (tempsOf(a) - tempsOf(b)));
    data.forEach((row, i) => { row.rang = i + 1; });
  }
  const colour = p => p >= 80 ? 'var(--success)' : p >= 50 ? 'var(--orange)' : 'var(--error)';
  const progOf = row => {
    const count = tab === 'app' ? (row.niveauxCompletes || row.niveaux || 0) : (row.appsCompletes || row.apps || 0);
    const total = tab === 'app' ? (row.totalNiveaux || 0) : (row.totalPossibleNiveaux || 0);
    const done  = tab === 'app' ? count : (row.niveauxTotal || 0);
    return { count, total, label: tab === 'app' ? 'niveaux' : 'apps', ratio: total > 0 ? Math.min(1, done / total) : 0 };
  };
  let html = '';
  const me = data.find(r => String(r.email || '').toLowerCase() === myEmail);
  if (me) {
    const p = pctOf(me), g = progOf(me);
    html += '<div class="lb-me"><div><b style="color:var(--accent)">#' + esc(me.rang) + '</b><span>RANG</span></div>' +
      '<div><b>' + esc(me.totalPoints) + '</b><span>POINTS</span></div>' +
      '<div><b style="color:' + colour(p) + '">' + esc(p) + ' %</b><span>RÉUSSITE</span></div>' +
      '<div><b>' + g.count + (tab === 'app' && g.total ? '/' + g.total : '') + '</b><span>' + g.label.toUpperCase() + '</span></div></div>';
  }
  const medals = ['🥇', '🥈', '🥉'];
  html += '<table class="lb-t"><thead><tr><th>#</th><th>Élève</th><th class="r">Pts</th><th class="r">%</th><th class="r">Temps</th></tr></thead><tbody>';
  data.forEach(row => {
    const r = row.rang || 0, email = String(row.email || ''), p = pctOf(row), g = progOf(row);
    const name = email.split('@')[0].split(/[._-]+/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    html += '<tr class="' + (email.toLowerCase() === myEmail ? 'me' : '') + '"><td>' + (r >= 1 && r <= 3 ? medals[r - 1] : esc(r)) + '</td>' +
      '<td>' + esc(name) + (g.total ? '<div class="lb-bar"><i style="width:' + Math.round(g.ratio * 100) + '%"></i></div>' : '') + '</td>' +
      '<td class="r mono" style="color:var(--accent)">' + esc(row.totalPoints) + '</td>' +
      '<td class="r mono" style="color:' + colour(p) + '">' + esc(p) + ' %</td>' +
      '<td class="r mono" style="color:var(--text2)">' + formatTime(tempsOf(row)) + '</td></tr>';
  });
  $('lbContent').innerHTML = html + '</tbody></table>';
}

/* ============================================================
   12. DÉMARRAGE
   ============================================================ */
renderScreen();
showEmailModal();          // toujours affiché au lancement, même si un e-mail est mémorisé
</script>
